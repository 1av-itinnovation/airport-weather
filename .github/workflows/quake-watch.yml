name: Earthquake Watch

# A quick check every 5 minutes for a strong earthquake the dashboard does not show yet.
# Most runs finish in a few seconds and change nothing. When a new earthquake is found, the same
# run does a full refresh, so the dashboard updates and the Teams and email alert go out.
on:
  schedule:
    - cron: "2-59/5 * * * *"
  repository_dispatch:
    types: [quake-check]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: airport-weather-quake-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Look for a new earthquake
        id: watch
        run: python3 quake_watch.py

      - name: Build latest weather data
        if: steps.watch.outputs.refresh == 'true'
        run: python3 build.py

      - name: Check for alerts to send
        id: alerts
        if: steps.watch.outputs.refresh == 'true'
        env:
          NOTIFY_CHECK: "1"
        run: python3 notify.py

      - name: Commit updated data
        if: steps.watch.outputs.refresh == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILES="docs/data.json docs/rain.json notify_state.json"

          # If something else was pushed while this run was working (a file upload, or another run),
          # start again from the newest version and put this run's fresh data on top. The data files
          # are always replaced whole, so there is never anything to merge.
          for attempt in 1 2 3; do
            for f in $FILES; do if [ -f "$f" ]; then git add "$f"; fi; done
            if git diff --cached --quiet; then
              echo "No generated data changes to commit."
              exit 0
            fi
            git commit -q -m "chore: refresh airport weather data"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push was refused (attempt $attempt); taking the newest version and trying again."
            mkdir -p /tmp/fresh
            for f in $FILES; do if [ -f "$f" ]; then cp "$f" "/tmp/fresh/$(basename "$f")"; fi; done
            git fetch -q origin main
            git reset -q --hard origin/main
            for f in $FILES; do if [ -f "/tmp/fresh/$(basename "$f")" ]; then cp "/tmp/fresh/$(basename "$f")" "$f"; fi; done
          done
          echo "Could not save the data after 3 attempts."
          exit 1

      - name: Wait for the dashboard to publish
        # Only when an alert is about to go out: wait until the website shows this refresh, so the alert and the
        # dashboard agree. Gives up after about two and a half minutes and sends the alert anyway.
        if: steps.watch.outputs.refresh == 'true' && steps.alerts.outputs.pending == 'true'
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          want = json.load(open("docs/data.json", encoding="utf-8")).get("generated_ms")
          owner, name = os.environ["GITHUB_REPOSITORY"].split("/", 1)
          url = f"https://{owner.lower()}.github.io/{name}/data.json"
          for i in range(30):
              try:
                  got = json.load(urllib.request.urlopen(f"{url}?t={time.time()}", timeout=15)).get("generated_ms")
                  if got == want:
                      print(f"Dashboard is showing this refresh after about {i * 5} seconds."); break
              except Exception as e:
                  print("not yet:", type(e).__name__)
              time.sleep(5)
          else:
              print("Dashboard not updated yet; sending the alert anyway.")
          PY

      - name: Send alerts
        if: steps.watch.outputs.refresh == 'true'
        # Sends one email for each new earthquake alert or new Danger airport.
        # Does nothing until the SMTP_HOST and MAIL_TO secrets are set. Never stops the refresh.
        continue-on-error: true
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: python3 notify.py

      - name: Save the record of alerts sent
        if: steps.watch.outputs.refresh == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILES="docs/data.json docs/rain.json notify_state.json"

          # If something else was pushed while this run was working (a file upload, or another run),
          # start again from the newest version and put this run's fresh data on top. The data files
          # are always replaced whole, so there is never anything to merge.
          for attempt in 1 2 3; do
            for f in $FILES; do if [ -f "$f" ]; then git add "$f"; fi; done
            if git diff --cached --quiet; then
              echo "No generated data changes to commit."
              exit 0
            fi
            git commit -q -m "chore: refresh airport weather data"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push was refused (attempt $attempt); taking the newest version and trying again."
            mkdir -p /tmp/fresh
            for f in $FILES; do if [ -f "$f" ]; then cp "$f" "/tmp/fresh/$(basename "$f")"; fi; done
            git fetch -q origin main
            git reset -q --hard origin/main
            for f in $FILES; do if [ -f "/tmp/fresh/$(basename "$f")" ]; then cp "/tmp/fresh/$(basename "$f")" "$f"; fi; done
          done
          echo "Could not save the data after 3 attempts."
          exit 1
