name: Refresh Airport Weather Data

on:
  schedule:
    # Run every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: airport-weather-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build latest weather data
        run: python3 build.py

      - name: Check generated data
        run: |
          test -f docs/data.json
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          with open("docs/data.json", encoding="utf-8") as f:
              data = json.load(f)

          generated_ms = data.get("generated_ms")
          if not generated_ms:
              raise SystemExit("ERROR: docs/data.json has no generated_ms")

          generated = datetime.fromtimestamp(
              generated_ms / 1000, tz=timezone.utc
          )
          age = (datetime.now(timezone.utc) - generated).total_seconds() / 60

          print(f"data generated: {generated.isoformat()}")
          print(f"data age: {age:.1f} minutes")

          if age > 15:
              raise SystemExit(
                  f"ERROR: generated data is already {age:.1f} minutes old."
              )
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data.json docs/rain.json

          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
          else
            git commit -m "chore: refresh airport weather data"
            git push || (git pull --rebase && git push)
          fi
