name: Refresh dashboard data

on:
  schedule:
    - cron: "*/10 * * * *"      # every 10 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:             # lets you press "Run workflow" by hand
  push:
    branches: [main]
    paths: ["build.py", ".github/workflows/refresh.yml"]

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Pull the data and apply the alert rules
        run: python3 build.py

      - name: Save the new data
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add docs/data.json docs/rain.json
          if git diff --cached --quiet; then
            echo "No change in data."
          else
            git commit -m "Refresh data"
            git push || (git pull --rebase && git push)
          fi
