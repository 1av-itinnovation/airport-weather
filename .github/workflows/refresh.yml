name: Refresh Airport Weather Data

on:
  schedule:
    # Every 10 minutes, at minutes 7, 17, 27, 37, 47 and 57.
    # GitHub advises against the start of the hour, when scheduled jobs are most often
    # delayed or dropped, so this avoids :00 and the other round minutes.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: airport-weather-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build latest weather data
        run: python3 build.py

      - name: Check generated data
        run: |
          test -f docs/data.json
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          with open("docs/data.json", encoding="utf-8") as f:
              data = json.load(f)

          generated_ms = data.get("generated_ms")
          if not generated_ms:
              raise SystemExit("ERROR: docs/data.json has no generated_ms")

          generated = datetime.fromtimestamp(
              generated_ms / 1000, tz=timezone.utc
          )
          age = (datetime.now(timezone.utc) - generated).total_seconds() / 60

          print(f"data generated: {generated.isoformat()}")
          print(f"data age: {age:.1f} minutes")

          if age > 15:
              raise SystemExit(
                  f"ERROR: generated data is already {age:.1f} minutes old."
              )
          PY

      - name: Email new alerts
        # Sends one email for each new earthquake alert or new Danger airport.
        # Does nothing until the SMTP_HOST and MAIL_TO secrets are set. Never stops the refresh.
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: python3 notify.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILES="docs/data.json docs/rain.json notify_state.json"

          # If something else was pushed while this run was working (a file upload, or another run),
          # start again from the newest version and put this run's fresh data on top. The data files
          # are always replaced whole, so there is never anything to merge.
          for attempt in 1 2 3; do
            for f in $FILES; do if [ -f "$f" ]; then git add "$f"; fi; done
            if git diff --cached --quiet; then
              echo "No generated data changes to commit."
              exit 0
            fi
            git commit -q -m "chore: refresh airport weather data"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push was refused (attempt $attempt); taking the newest version and trying again."
            mkdir -p /tmp/fresh
            for f in $FILES; do if [ -f "$f" ]; then cp "$f" "/tmp/fresh/$(basename "$f")"; fi; done
            git fetch -q origin main
            git reset -q --hard origin/main
            for f in $FILES; do if [ -f "/tmp/fresh/$(basename "$f")" ]; then cp "/tmp/fresh/$(basename "$f")" "$f"; fi; done
          done
          echo "Could not save the data after 3 attempts."
          exit 1
